name: WireGuard URI parser tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'forkop/files/usr/lib/subscription/wireguard_uri.uc'
      - 'forkop/files/usr/lib/subscription/amnezia_conf.uc'
      - 'tests/wireguard_uri.uc'
      - '.github/workflows/wireguard-uri-tests.yml'

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Build pinned ucode
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libjson-c-dev pkg-config cmake build-essential
          git clone https://github.com/jow-/ucode.git "$RUNNER_TEMP/ucode-source"
          git -C "$RUNNER_TEMP/ucode-source" checkout --detach 4a28662538275b67a0bcf11de25c365c1ec7a99d
          test "$(git -C "$RUNNER_TEMP/ucode-source" rev-parse HEAD)" = 4a28662538275b67a0bcf11de25c365c1ec7a99d
          cmake -S "$RUNNER_TEMP/ucode-source" -B "$RUNNER_TEMP/ucode-build" -DCMAKE_BUILD_TYPE=Release -DFS_SUPPORT=ON -DDIGEST_SUPPORT=OFF -DFFI_SUPPORT=OFF
          cmake --build "$RUNNER_TEMP/ucode-build" --target ucode fs_lib --parallel 2
      - name: Test synthetic share links
        run: |
          "$RUNNER_TEMP/ucode-build/ucode" -L "$RUNNER_TEMP/ucode-build/*.so" -L "$GITHUB_WORKSPACE/forkop/files/usr/lib/*.uc" tests/wireguard_uri.uc
