name: Subscription parser CI

on:
  push:
    paths:
      - 'forkop/files/usr/lib/**'
      - 'tests/subscription_source_entry.uc'
      - 'tests/list_cache.sh'
      - 'tests/google_gemini_inline.sh'
      - 'tests/amnezia*'
      - 'scripts/tests/test_awg_launcher.py'
      - '.github/workflows/subscription-ci.yml'
  pull_request:
    paths:
      - 'forkop/files/usr/lib/**'
      - 'tests/subscription_source_entry.uc'
      - 'tests/list_cache.sh'
      - 'tests/google_gemini_inline.sh'
      - 'tests/amnezia*'
      - 'scripts/tests/test_awg_launcher.py'
      - '.github/workflows/subscription-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription-source-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UCODE_COMMIT: 4a28662538275b67a0bcf11de25c365c1ec7a99d
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Install runtime build dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(libjson-c-dev pkg-config nftables busybox-static)
          if ! command -v cmake >/dev/null; then packages+=(cmake); fi
          if ! command -v cc >/dev/null || ! command -v make >/dev/null; then packages+=(build-essential); fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y "${packages[@]}"

      - name: Build pinned ucode runtime and filesystem module
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/jow-/ucode.git "$RUNNER_TEMP/ucode-source"
          git -C "$RUNNER_TEMP/ucode-source" checkout --detach "$UCODE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/ucode-source" rev-parse HEAD)" = "$UCODE_COMMIT"
          cmake -S "$RUNNER_TEMP/ucode-source" -B "$RUNNER_TEMP/ucode-build" \
            -DCMAKE_BUILD_TYPE=Release -DFS_SUPPORT=ON \
            -DDIGEST_SUPPORT=OFF -DFFI_SUPPORT=OFF
          cmake --build "$RUNNER_TEMP/ucode-build" --target ucode fs_lib --parallel 2

      - name: Test arbitrary HTTPS subscription sources
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ucode-build/ucode" \
            -L "$RUNNER_TEMP/ucode-build/*.so" \
            -L "$GITHUB_WORKSPACE/forkop/files/usr/lib/*.uc" \
            tests/subscription_source_entry.uc

      - name: Test isolated policy routing for bound sockets
        shell: bash
        run: sudo bash tests/amnezia_oif_routing.sh

      - name: Test isolated AWG nft guard
        shell: bash
        run: sudo sh tests/amnezia_nft_guard.sh

      - name: Test AWG lifecycle ordering and candidate staging
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/amnezia_lifecycle_contract.py
          export FORKOP_TEST_UCODE_BINARY="$RUNNER_TEMP/ucode-build/ucode"
          export FORKOP_TEST_UCODE_MODULES="$RUNNER_TEMP/ucode-build"
          mkdir -p "$RUNNER_TEMP/awg-ucode-bin"
          cat > "$RUNNER_TEMP/awg-ucode-bin/ucode" <<'EOF'
          #!/bin/sh
          exec "$FORKOP_TEST_UCODE_BINARY" -L "$FORKOP_TEST_UCODE_MODULES/*.so" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/awg-ucode-bin/ucode"
          PATH="$RUNNER_TEMP/awg-ucode-bin:$PATH" sh tests/amnezia_nft_candidate.sh

      - name: Test pinned AmneziaWG dependency installer
        shell: bash
        run: python3 scripts/tests/test_awg_installer.py -v

      - name: Test one-command installer
        shell: bash
        run: sudo python3 -m unittest discover -s scripts/tests -p test_artak_installer.py -v

      - name: Test AWG launcher
        run: python3 scripts/tests/test_awg_launcher.py -v

      - name: Test AmneziaWG package mirror integrity
        run: python3 -m unittest discover -s scripts/tests -p test_awg_bootstrap.py -v

      - name: Test service checks and subscription change reports
        shell: bash
        run: |
          set -uo pipefail
          result=0
          for test in tests/service_check.uc tests/subscription_change_report.uc tests/amnezia_conf.uc tests/amnezia_subscription.uc tests/amnezia_subscription_pipeline.uc tests/amnezia_netifd.uc tests/amnezia_routes.uc tests/amnezia_import.uc tests/network_redact.uc tests/amnezia_activate.uc tests/amnezia_runtime_check.uc tests/amnezia_handshake.uc tests/amnezia_verify.uc tests/amnezia_guard_plan.uc tests/amnezia_guard.uc tests/amnezia_allocate.uc tests/amnezia_rpc_import.uc; do
            echo "Running $test"
            "$RUNNER_TEMP/ucode-build/ucode" \
              -L "$RUNNER_TEMP/ucode-build/*.so" \
              -L "$GITHUB_WORKSPACE/forkop/files/usr/lib/*.uc" "$test" || result=1
          done
          exit "$result"

      - name: Test list cache ownership and transactional rollback
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          export FORKOP_TEST_UCODE_BINARY="$RUNNER_TEMP/ucode-build/ucode"
          export FORKOP_TEST_UCODE_MODULES="$RUNNER_TEMP/ucode-build"
          mkdir -p "$RUNNER_TEMP/ucode-bin"
          cat > "$RUNNER_TEMP/ucode-bin/ucode" <<'EOF'
          #!/bin/sh
          exec "$FORKOP_TEST_UCODE_BINARY" -L "$FORKOP_TEST_UCODE_MODULES/*.so" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/ucode-bin/ucode"
          export PATH="$RUNNER_TEMP/ucode-bin:$PATH"
          result=0
          for test in tests/list_cache.sh tests/google_gemini_inline.sh tests/urltest_empty_groups.sh tests/priority_reserve.sh tests/subscription_report_runtime.sh tests/amnezia_store.sh tests/amnezia_preflight_rpc.sh tests/amnezia_candidate.sh tests/amnezia_active.sh tests/amnezia_job.sh tests/amnezia_swap.sh tests/amnezia_generation.sh; do
            echo "Running $test"
            bash "$test" || result=1
          done
          exit "$result"
