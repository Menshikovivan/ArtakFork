name: ArtakFork release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package and release version
        required: true
        default: 2.4.3-canary.7
        type: string

permissions:
  contents: read

concurrency:
  group: artak-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Validate version
        run: |
          bash build.sh --check-version "$VERSION"
          test "$(sed -n 's/^VERSION=//p' artak-install.sh)" = "$VERSION"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Match the upstream build environment and exclude the unrelated
          # Chrome apt source, which can fail independently of this build.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo rm -f "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y build-essential busybox-static curl fakeroot file gawk git patch perl tar unzip util-linux xz-utils zstd

      - name: Check standalone installer
        run: |
          node tests/subscription_url_ui.cjs
          sh -n artak-install.sh
          sudo python3 -m unittest discover -s scripts/tests -p test_artak_installer.py

      - name: Build six release packages
        run: bash build.sh "$VERSION" "$PWD/filtered-bin/artak-release"

      - name: Preserve verified compatible pinned upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_artak_bootstrap.py --use-pinned --output filtered-bin/artak-release

      - name: Mirror verified AmneziaWG packages and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s scripts/tests -p test_awg_bootstrap.py -v
          python3 -m unittest discover -s scripts/tests -p test_awg_sources.py -v
          python3 scripts/prepare_awg_bootstrap.py filtered-bin/artak-release
          python3 scripts/prepare_awg_sources.py filtered-bin/artak-release

      - name: Prepare installer and package checksums
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$PWD/filtered-bin/artak-release"
          cp artak-install.sh "$release_dir/artak-install.sh"
          cp scripts/install-awg-dependencies.sh "$release_dir/install-awg-dependencies.sh"
          cd "$release_dir"
          packages=()
          for package in forkop luci-app-forkop luci-i18n-forkop-ru; do
            for format in apk ipk; do
              file="${package}_${VERSION}.${format}"
              test -s "$file"
              packages+=("$file")
            done
          done
          bootstrap=(upstream-*.apk sing-box-extended_*.apk)
          test "${#bootstrap[@]}" -eq 4
          awg=(amneziawg-tools_*.apk kmod-amneziawg_*.apk luci-proto-amneziawg_*.apk)
          test "${#awg[@]}" -eq 3
          sources=(upstream-forkop-source.tar.gz sing-box-extended-source.tar.gz amneziawg-openwrt-source.tar.gz amneziawg-tools-source.tar.gz amneziawg-kmod-source.tar.gz)
          for file in "${bootstrap[@]}" "${awg[@]}" "${sources[@]}"; do test -s "$file"; done
          sha256sum "${packages[@]}" "${bootstrap[@]}" "${awg[@]}" "${sources[@]}" install-awg-dependencies.sh > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: artak-release-${{ inputs.version }}
          path: |
            filtered-bin/artak-release/*.apk
            filtered-bin/artak-release/*.ipk
            filtered-bin/artak-release/SHA256SUMS
            filtered-bin/artak-release/artak-install.sh
            filtered-bin/artak-release/install-awg-dependencies.sh
            filtered-bin/artak-release/bootstrap-sources.json
            filtered-bin/artak-release/amneziawg-sources.json
            filtered-bin/artak-release/amneziawg-upstream-sources.json
            filtered-bin/artak-release/*-source.tar.gz
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: artak-release-${{ inputs.version }}
          path: release

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          cat > "$RUNNER_TEMP/artak-release-notes.md" <<'EOF'
          ArtakFork is an independent source modification of Forkop X.

          ArtakFork improves diagnostics for empty URLTest groups, configured priority backups, service checks and subscription updates. See the README for behavior and limitations. The installer uses compatible pinned bootstrap packages, then installs ArtakFork.

          The one-command installer supports stable OpenWrt 25.12 APK on aarch64_cortex-a53. It uses upstream Forkop 1.0.5 and sing-box Extended 1.14.3-extended-2.7.3, pinned for compatibility; upstream Forkop 2.0 changes the engine and migration and is not used by this release. The release contains six ArtakFork packages, verified upstream APKs, sources and checksums. The installer backs up router configuration before installing.

          Attribution and corresponding source: upstream Forkop by ushan0v (https://github.com/ushan0v/forkop, GPL-2.0-or-later); Forkop X by Screamshow (https://github.com/Screamshow/forkop-x, GPL-2.0-or-later); sing-box Extended by shtorm-7 and contributors, based on SagerNet sing-box (https://github.com/shtorm-7/sing-box-extended, GPL-3.0-or-later with the upstream naming condition). Original notices and licenses remain in the attached upstream-forkop-source.tar.gz and sing-box-extended-source.tar.gz archives. The ArtakFork source at this release tag supplies the modified backend and build scripts. No association with upstream authors is implied.

          Experimental AmneziaWG support uses OpenWrt packages by 2Grey and AmneziaWG tools and kernel module by the AmneziaVPN contributors. The associated packaging and upstream source archives, version pins and checksums are attached. See docs/amneziawg-experimental.md for supported configurations and limitations.

          Packages are distributed directly through this GitHub release, without a custom mirror. APK files are unsigned; the installer explicitly uses apk --allow-untrusted for these downloaded local packages. No APK signing key is supplied.
          EOF
          assets=(*.apk *.ipk *-source.tar.gz SHA256SUMS artak-install.sh install-awg-dependencies.sh bootstrap-sources.json amneziawg-sources.json amneziawg-upstream-sources.json)
          gh release create "$VERSION" "${assets[@]}" \
            --target "$RELEASE_COMMIT" \
            --prerelease \
            --title "ArtakFork $VERSION" \
            --notes-file "$RUNNER_TEMP/artak-release-notes.md"
